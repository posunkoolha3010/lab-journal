<style>
/* Layout idea: a lab notebook — sticky header with the two labs as a switch,
   a dated timeline of experiments, a stock ledger, and a side sheet for editing. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1c2420; --muted:#66716b; --line:#dde2db;
  --accent:#1f6c66; --accent-soft:#e1efec;
  --babtai:#4c8a37; --babtai-soft:#e8f2e1; --kaunas:#3c5aa6; --kaunas-soft:#e6ebf7;
  --ok:#2e7d4f; --warn:#b06414; --warn-soft:#fbefe1; --bad:#b3261e; --bad-soft:#fbe7e5;
  --font-display:"Unbounded", "Onest", system-ui, sans-serif;
  --font-body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px; --shadow:0 12px 40px rgba(20,30,25,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#191e1b; --ink:#e4e9e5; --muted:#99a49d; --line:#2b332e;
    --accent:#5cb8ad; --accent-soft:#1d3532;
    --babtai:#86c46f; --babtai-soft:#1f2e1a; --kaunas:#93aaf0; --kaunas-soft:#1d2440;
    --ok:#6cc08f; --warn:#e7a35a; --warn-soft:#3a2a17; --bad:#f08a80; --bad-soft:#3b1d1a;
    --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191e1b; --ink:#e4e9e5; --muted:#99a49d; --line:#2b332e;
  --accent:#5cb8ad; --accent-soft:#1d3532;
  --babtai:#86c46f; --babtai-soft:#1f2e1a; --kaunas:#93aaf0; --kaunas-soft:#1d2440;
  --ok:#6cc08f; --warn:#e7a35a; --warn-soft:#3a2a17; --bad:#f08a80; --bad-soft:#3b1d1a;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand tabs" "seg tools";gap:8px 16px;align-items:center}
.top-in .brand{grid-area:brand}
.top-in nav.tabs{grid-area:tabs;min-width:0;overflow-x:auto;scrollbar-width:none}
.top-in nav.tabs::-webkit-scrollbar{display:none}
.top-in .seg{grid-area:seg;justify-self:start;white-space:nowrap}
.top-in .tools{grid-area:tools;justify-self:end;display:flex;align-items:center;gap:12px;min-width:0}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .mark{display:inline-flex;width:26px;height:26px}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[data-site="babtai"][aria-pressed="true"]{background:var(--babtai);color:#fff}
.seg button[data-site="kaunas"][aria-pressed="true"]{background:var(--kaunas);color:#fff}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)} .sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="local"]::before{background:var(--warn)} .sync[data-s="err"]::before{background:var(--bad)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1412}}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:13px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f>span{text-transform:uppercase;letter-spacing:.04em}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* main */
main{max-width:1120px;margin:0 auto;padding:18px 16px 80px;display:grid;gap:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--font-mono);font-size:22px;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
section.block{display:grid;gap:10px}
.block-h{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:6px}
.block-h .n{font-family:var(--font-mono)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:112px 1fr auto;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.s-babtai{border-left-color:var(--babtai)} .card.s-kaunas{border-left-color:var(--kaunas)}
.card.s-both{border-left-color:transparent;background:linear-gradient(var(--babtai) 50%,var(--kaunas) 50%) 0 0/4px 100% no-repeat border-box,var(--surface)}
.card .d{font-family:var(--font-mono);font-size:13px;color:var(--muted);line-height:1.35}
.card .d b{display:block;color:var(--ink);font-size:14px;white-space:nowrap}
.card h3{font-size:16px;font-weight:600;line-height:1.3}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.prog{display:grid;gap:4px;justify-items:end;min-width:88px}
.prog .bar{width:88px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.prog small{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.babtai{background:var(--babtai-soft);color:var(--babtai);border-color:transparent}
.tag.kaunas{background:var(--kaunas-soft);color:var(--kaunas);border-color:transparent}
.tag.st-planned{background:var(--bg)} .tag.st-active{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.st-done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.file{font-family:var(--font-mono);font-weight:400}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.filebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.filebar.warn{background:var(--warn-soft)}
.chain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:4px}
.kids{margin-left:22px;padding-left:12px;border-left:2px solid var(--line);display:grid;gap:4px}
.node{display:flex;gap:6px;align-items:center;border-radius:8px}
.node.waiting{background:var(--warn-soft)}
.waitlist .node{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);padding-right:6px}
.node-main{flex:1;min-width:0;display:grid;grid-template-columns:112px 1fr;gap:2px 12px;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer}
.node-main:hover{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.node-main .d{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px;line-height:1.4}
.node-main .d b{color:var(--ink);font-size:13px;white-space:nowrap}
.node-t{display:block;font-weight:600}
.node-main .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.node-main .sub{display:block;color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.path{display:inline-flex;gap:3px;align-items:center;color:var(--muted);font-size:12px}
.move{font-size:12px;font-weight:600;color:var(--warn);padding:0 8px}
.tag.wait{background:var(--warn);color:#fff;border-color:transparent}
.tag.loc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.next{flex:none}
.parents{display:flex;flex-wrap:wrap;gap:6px;align-items:center;grid-column:1/-1}
.parents .lbl{width:100%;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pchip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 10px;font-size:13px}
.parents select{width:auto;max-width:100%}
@media (max-width:640px){.node{flex-wrap:wrap}.node-main{grid-template-columns:1fr}.kids{margin-left:8px;padding-left:8px}}
.tag.fzs-stored{background:var(--kaunas-soft);color:var(--kaunas);border-color:transparent}
.tag.fzs-partial{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.fz{background:var(--kaunas-soft);color:var(--kaunas);border-color:transparent}
tr.fz-used td,tr.fz-discarded td{opacity:.55}
.fzbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--bg)}
.fzbox .lbl{width:100%;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fzbox .pchip{padding:3px 10px;text-decoration:none}
.cal-head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.cal-title{font-family:var(--font-display);font-size:18px;font-weight:500;min-width:170px;text-align:center}
.cal-year{display:flex;flex-wrap:wrap;gap:3px}
.cal-m{border:1px solid transparent;background:none;border-radius:8px;padding:4px 7px;font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.cal-m.act{color:var(--ink);font-weight:600}
.cal-m i{font-style:normal;font-family:var(--font-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 5px}
.cal-m.on{border-color:var(--line);background:var(--surface)}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cal-wd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{min-height:84px;border:1px solid transparent;border-radius:8px;background:none;padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;font:inherit;color:inherit;min-width:0}
.cal-cell.pad{min-height:0}
button.cal-cell{cursor:default}
.cal-cell.has{cursor:pointer;background:var(--bg)}
.cal-cell.has:hover{border-color:var(--muted)}
.cal-cell.babtai{background:var(--babtai-soft);border-left:3px solid var(--babtai)}
.cal-cell.kaunas{background:var(--kaunas-soft);border-left:3px solid var(--kaunas)}
.cal-cell.both{background:linear-gradient(135deg,var(--babtai-soft) 50%,var(--kaunas-soft) 50%);border-left:3px solid var(--babtai)}
.cal-cell.today .cal-n{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 6px}
.cal-cell.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cal-n{font-family:var(--font-mono);font-size:13px;font-weight:600;align-self:flex-start}
.cal-items{display:grid;gap:2px;min-width:0}
.cal-t{font-size:11.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-t.more{color:var(--muted)}
.cal-dot{display:none}
.cal-side{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:640px;overflow:auto}
.cal-row{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:start;text-align:left;background:none;border:0;border-radius:8px;padding:7px 6px;cursor:pointer;font:inherit;color:inherit}
.cal-row:hover{background:var(--bg)}
.cal-row-d{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px}
.cal-row b{display:block;font-weight:600;font-size:14px}
.cal-row .small{display:block;font-size:12px;color:var(--muted)}
.cal-row-s{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
@media (max-width:860px){.cal-wrap{grid-template-columns:1fr}.cal-side{max-height:none}}
@media (max-width:640px){.cal-cell{min-height:46px;padding:4px;align-items:center}.cal-items{display:none}.cal-dot{display:block;font-size:10px;font-family:var(--font-mono);color:var(--muted)}.cal-n{align-self:center}.cal-title{min-width:0;flex:1}}
nav.tabs a{white-space:nowrap}
@media (max-width:760px){
  .top-in{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand tools" "tabs tabs" "seg seg";gap:8px}
  .top-in nav.tabs{-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
  .top-in .sync{font-size:0;gap:0}
}
select.lang{width:auto;padding:5px 8px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}

/* reagents table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--bg)}
td.r,th.r{text-align:right}
td .small{display:block;font-size:12px;color:var(--muted)}
.rname{font-weight:600}
.site-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.site-dot.babtai{background:var(--babtai)} .site-dot.kaunas{background:var(--kaunas)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:40;display:none}
.scrim.open{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column}
aside.drawer.open{transform:none}
.dr-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-head .t{flex:1;font-family:var(--font-display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dr-body{overflow-y:auto;padding:16px;display:grid;gap:18px;align-content:start}
.title-in{font-size:20px;font-weight:700;border:0!important;padding:4px 0!important;background:none!important;box-shadow:none!important;border-bottom:2px solid var(--line)!important;border-radius:0!important}
.title-in:focus{border-bottom-color:var(--accent)!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sec-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec-h h3{font-size:13px;font-family:var(--font-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stage{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.stage.babtai{border-left-color:var(--babtai)} .stage.kaunas{border-left-color:var(--kaunas)}
.stage.flash{box-shadow:0 0 0 3px var(--accent);transition:box-shadow .3s}
.stage.done{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.stage-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.stage-row2{display:grid;grid-template-columns:150px 150px 1fr;gap:8px}
.stage-num{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.usage{display:grid;grid-template-columns:minmax(150px,2fr) 90px 76px minmax(90px,1.4fr) auto;gap:6px;align-items:center}
.usage .calc{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px;padding-left:2px}
.usage .calc b{font-family:var(--font-mono);color:var(--ink)}
.usage .calc.bad{color:var(--bad)} .usage .calc.low b{color:var(--bad)}
.usages{display:grid;gap:8px;background:var(--bg);border-radius:8px;padding:8px}
.usages-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:8px;align-items:center;justify-content:space-between}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.log{display:grid;gap:6px}
.log-item{display:grid;grid-template-columns:118px 1fr auto;gap:8px;font-size:14px;align-items:start}
.log-item time{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px}
.bal{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;background:var(--bg);border-radius:var(--r);padding:12px 14px}
.bal b{font-family:var(--font-mono);font-size:26px}
.bal.low b{color:var(--bad)}
.bal span{color:var(--muted);font-size:13px}
.comp{display:grid;grid-template-columns:minmax(120px,1.6fr) 80px 70px 90px 90px minmax(120px,1.4fr) auto;gap:6px;align-items:center}
.comp-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.batch{display:grid;grid-template-columns:140px 140px 90px 70px 1fr auto;gap:6px;align-items:center}
.ledger td{font-size:13px}
.ledger tr.add td{background:color-mix(in srgb,var(--babtai-soft) 50%,transparent)}
.ledger tr.count td{background:color-mix(in srgb,var(--kaunas-soft) 50%,transparent)}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.hint{font-size:13px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,15,12,.45)}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px;display:grid;gap:14px}
.modal-box h2{font-family:var(--font-display);font-size:17px;font-weight:500}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:80;font-size:14px;display:none}
.toast.show{display:block}

@media (max-width:640px){
  .card{grid-template-columns:1fr}
  .prog{justify-items:start}
  .stage-row2{grid-template-columns:1fr 1fr}
  .stage-row2 .full{grid-column:1/-1}
  .usage{grid-template-columns:1fr 80px 72px auto}
  .usage .note{grid-column:1/-2}
  .comp{grid-template-columns:1fr 70px 64px auto}
  .comp .opt,.comp-h .opt{display:none}
  .batch{grid-template-columns:1fr 1fr;}
  .log-item{grid-template-columns:1fr auto}
  .log-item time{grid-column:1/-1}
  .hide-m{display:none}
  .toolbar input[type=search]{max-width:none}
}
</style>
</head>

<header class="top">

    <nav class="tabs" data-i-aria="nav.aria">
      <a href="#calendar" data-tab="calendar" data-i-key="tabs.calendar"></a>
      <a href="#journal" data-tab="journal" data-i-key="tabs.journal"></a>
      <a href="#chains" data-tab="chains" data-i-key="tabs.chains"></a>
      <a href="#freezer" data-tab="freezer" data-i-key="tabs.freezer"></a>
      <a href="#reagents" data-tab="reagents" data-i-key="tabs.reagents"></a>
    </nav>
    <div class="seg" role="group" data-i-aria="site.aria">
      <button type="button" data-site="all" aria-pressed="true" data-i-key="site.all"></button>
      <button type="button" data-site="babtai" aria-pressed="false" data-i-key="site.babtai"></button>
      <button type="button" data-site="kaunas" aria-pressed="false" data-i-key="site.kaunas"></button>
    </div>
    <div class="tools">
      <span class="sync" id="sync" data-s="" data-i-key="connecting"></span>
      <select id="lang" class="lang" data-i-aria="lang.aria"></select>
    </div>
  </div>
</header>

<main id="main">
  <div class="empty" data-i-key="loading"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head"><span class="t" id="drTitle"></span><span id="drActions" class="row-actions"></span><button class="btn ghost" type="button" data-act="close" data-i-aria="close">✕</button></div>
  <div class="dr-body" id="drBody"></div>
</aside>
<div class="modal" id="modal"><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="openFile" accept=".json,application/json" hidden>

  return s;
}

/* ============================== export / import ============================== */
async function doExport() {
  const data = JSON.stringify({ app: "labjournal", version: 1, exportedAt: new Date().toISOString(), experiments: S.exp, reagents: S.rea, samples: S.smp }, null, 1);
  const fn = `lab-journal-${today()}.json`;
  if (downloads) { try { await downloads.save({ filename: fn, data }); return; } catch (e) { if (e && e.code === "declined") return; } }
  if (S.mode === "local" && saveDownload(fn, data)) return;
  try { await navigator.clipboard.writeText(data); toast(tr("toast.copied")); } catch { toast(tr("toast.saveFail")); }
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d; try { d = JSON.parse(fr.result); } catch { toast(tr("toast.notJournal")); return; }
    const ne = Object.keys(d.experiments || {}).length, nr = Object.keys(d.reagents || {}).length;
    confirmBox(tr("import"), esc(tr("imp.text", ne, nr)), tr("import"), async () => {
      for (const [id, o] of Object.entries(d.experiments || {})) { S.exp[id] = o; save("experiments", id, 50); }
      for (const [id, o] of Object.entries(d.reagents || {})) { S.rea[id] = o; save("reagents", id, 50); }
      for (const [id, o] of Object.entries(d.samples || {})) { S.smp[id] = o; save("samples", id, 50); }
      render(); toast(tr("imp.done"));
    });
  };
  fr.readAsText(file);
}

function onField(ev, final) {
  const el = ev.target; if (!el.dataset || !el.dataset.f || !$("#drBody").contains(el)) return;
  const o = Drawer.doc(); if (!o) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num && typeof v === "string") { const n = num(v); v = n == null ? (v.trim() === "" ? "" : v) : n; if (el.dataset.f === "low" && v === "") v = null; }
  const path = el.dataset.f;
  if (getPath(o, path) === v) return;
  setPath(o, path, v);
  // side effects
  const mu = path.match(/^stages\.(\d+)\.usages\.(\d+)\.reagentId$/);
  if (mu && S.rea[v]) { const u = o.stages[+mu[1]].usages[+mu[2]]; if (conv(1, u.unit, S.rea[v].unit) == null || !u.amount) u.unit = S.rea[v].unit; }
  if (/^stages\.\d+\.done$/.test(path) && Drawer.coll === "experiments") { const st = o.stages; if (st.length && st.every(s => s.done) && o.status !== "done") { o.status = "done"; const d = st.map(s => s.date).filter(Boolean).sort().pop(); if (d && !o.endDate) o.endDate = d; } else if (!st.every(s => s.done) && o.status === "planned") o.status = "active"; }
  save(Drawer.coll, Drawer.id, final ? 300 : 700);
  if (el.dataset.rerender || el.type === "checkbox" || /\.done$/.test(path) || path === "status" || path === "kind") { setTimeout(() => Drawer.render(), 0); }
  else Drawer.live();
  renderSoon();
}

  if (ev.target.tagName === "SELECT" || ev.target.type === "checkbox" || ev.target.type === "date") return;
  onField(ev, false);

  if (id === "fKind") { UI.kind = ev.target.value; render(); return; }
  if (id === "fLow") { UI.lowOnly = ev.target.checked; render(); return; }
  if (id === "openFile") { const f = ev.target.files[0]; ev.target.value = ""; if (!f) return; f.text().then(t => { try { applyData(parseJournal(t)); toast(tr("toast.opened", f.name)); } catch { toast(tr("toast.notJournal")); } }); return; }
  if (id === "importFile") { if (ev.target.files[0]) doImport(ev.target.files[0]); ev.target.value = ""; return; }
  onField(ev, true);
});
document.addEventListener("focusout", () => { setTimeout(() => { if (Drawer.stale && !$("#drBody").contains(document.activeElement)) Drawer.render(); }, 50); });
window.addEventListener("hashchange", () => { UI.q = ""; render(); });

applyStaticAll();
document.addEventListener("change", (ev) => { if (ev.target.id === "lang") setLang(ev.target.value); });
init();
</script>
</body>
</html>
