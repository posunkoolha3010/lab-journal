<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабжурнал Бабтай · Каунас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lab notebook — sticky header with the two labs as a switch,
   a dated timeline of experiments, a stock ledger, and a side sheet for editing. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1c2420; --muted:#66716b; --line:#dde2db;
  --accent:#1f6c66; --accent-soft:#e1efec;
  --babtai:#4c8a37; --babtai-soft:#e8f2e1; --kaunas:#3c5aa6; --kaunas-soft:#e6ebf7;
  --ok:#2e7d4f; --warn:#b06414; --warn-soft:#fbefe1; --bad:#b3261e; --bad-soft:#fbe7e5;
  --font-display:"Unbounded", "Onest", system-ui, sans-serif;
  --font-body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px; --shadow:0 12px 40px rgba(20,30,25,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#191e1b; --ink:#e4e9e5; --muted:#99a49d; --line:#2b332e;
    --accent:#5cb8ad; --accent-soft:#1d3532;
    --babtai:#86c46f; --babtai-soft:#1f2e1a; --kaunas:#93aaf0; --kaunas-soft:#1d2440;
    --ok:#6cc08f; --warn:#e7a35a; --warn-soft:#3a2a17; --bad:#f08a80; --bad-soft:#3b1d1a;
    --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191e1b; --ink:#e4e9e5; --muted:#99a49d; --line:#2b332e;
  --accent:#5cb8ad; --accent-soft:#1d3532;
  --babtai:#86c46f; --babtai-soft:#1f2e1a; --kaunas:#93aaf0; --kaunas-soft:#1d2440;
  --ok:#6cc08f; --warn:#e7a35a; --warn-soft:#3a2a17; --bad:#f08a80; --bad-soft:#3b1d1a;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;border-radius:3px;background:linear-gradient(var(--babtai) 50%,var(--kaunas) 50%)}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[data-site="babtai"][aria-pressed="true"]{background:var(--babtai);color:#fff}
.seg button[data-site="kaunas"][aria-pressed="true"]{background:var(--kaunas);color:#fff}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)} .sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="local"]::before{background:var(--warn)} .sync[data-s="err"]::before{background:var(--bad)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1412}}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:13px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f>span{text-transform:uppercase;letter-spacing:.04em}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* main */
main{max-width:1120px;margin:0 auto;padding:18px 16px 80px;display:grid;gap:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--font-mono);font-size:22px;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
section.block{display:grid;gap:10px}
.block-h{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:6px}
.block-h .n{font-family:var(--font-mono)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:92px 1fr auto;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.s-babtai{border-left-color:var(--babtai)} .card.s-kaunas{border-left-color:var(--kaunas)}
.card.s-both{border-left-color:transparent;background:linear-gradient(var(--babtai) 50%,var(--kaunas) 50%) 0 0/4px 100% no-repeat border-box,var(--surface)}
.card .d{font-family:var(--font-mono);font-size:13px;color:var(--muted);line-height:1.35}
.card .d b{display:block;color:var(--ink);font-size:15px}
.card h3{font-size:16px;font-weight:600;line-height:1.3}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.prog{display:grid;gap:4px;justify-items:end;min-width:88px}
.prog .bar{width:88px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.prog small{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.babtai{background:var(--babtai-soft);color:var(--babtai);border-color:transparent}
.tag.kaunas{background:var(--kaunas-soft);color:var(--kaunas);border-color:transparent}
.tag.st-planned{background:var(--bg)} .tag.st-active{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.st-done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.file{font-family:var(--font-mono);font-weight:400}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.filebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.filebar.warn{background:var(--warn-soft)}

/* reagents table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--bg)}
td.r,th.r{text-align:right}
td .small{display:block;font-size:12px;color:var(--muted)}
.rname{font-weight:600}
.site-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.site-dot.babtai{background:var(--babtai)} .site-dot.kaunas{background:var(--kaunas)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:40;display:none}
.scrim.open{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column}
aside.drawer.open{transform:none}
.dr-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-head .t{flex:1;font-family:var(--font-display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dr-body{overflow-y:auto;padding:16px;display:grid;gap:18px;align-content:start}
.title-in{font-size:20px;font-weight:700;border:0!important;padding:4px 0!important;background:none!important;box-shadow:none!important;border-bottom:2px solid var(--line)!important;border-radius:0!important}
.title-in:focus{border-bottom-color:var(--accent)!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sec-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec-h h3{font-size:13px;font-family:var(--font-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stage{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.stage.babtai{border-left-color:var(--babtai)} .stage.kaunas{border-left-color:var(--kaunas)}
.stage.done{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.stage-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.stage-row2{display:grid;grid-template-columns:150px 150px 1fr;gap:8px}
.stage-num{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.usage{display:grid;grid-template-columns:minmax(150px,2fr) 90px 76px minmax(90px,1.4fr) auto;gap:6px;align-items:center}
.usage .calc{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px;padding-left:2px}
.usage .calc b{font-family:var(--font-mono);color:var(--ink)}
.usage .calc.bad{color:var(--bad)} .usage .calc.low b{color:var(--bad)}
.usages{display:grid;gap:8px;background:var(--bg);border-radius:8px;padding:8px}
.usages-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:8px;align-items:center;justify-content:space-between}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.log{display:grid;gap:6px}
.log-item{display:grid;grid-template-columns:118px 1fr auto;gap:8px;font-size:14px;align-items:start}
.log-item time{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px}
.bal{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;background:var(--bg);border-radius:var(--r);padding:12px 14px}
.bal b{font-family:var(--font-mono);font-size:26px}
.bal.low b{color:var(--bad)}
.bal span{color:var(--muted);font-size:13px}
.comp{display:grid;grid-template-columns:minmax(120px,1.6fr) 80px 70px 90px 90px minmax(120px,1.4fr) auto;gap:6px;align-items:center}
.comp-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.batch{display:grid;grid-template-columns:140px 140px 90px 70px 1fr auto;gap:6px;align-items:center}
.ledger td{font-size:13px}
.ledger tr.add td{background:color-mix(in srgb,var(--babtai-soft) 50%,transparent)}
.ledger tr.count td{background:color-mix(in srgb,var(--kaunas-soft) 50%,transparent)}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.hint{font-size:13px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,15,12,.45)}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px;display:grid;gap:14px}
.modal-box h2{font-family:var(--font-display);font-size:17px;font-weight:500}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:80;font-size:14px;display:none}
.toast.show{display:block}

@media (max-width:640px){
  .card{grid-template-columns:1fr}
  .prog{justify-items:start}
  .stage-row2{grid-template-columns:1fr 1fr}
  .stage-row2 .full{grid-column:1/-1}
  .usage{grid-template-columns:1fr 80px 72px auto}
  .usage .note{grid-column:1/-2}
  .comp{grid-template-columns:1fr 70px 64px auto}
  .comp .opt,.comp-h .opt{display:none}
  .batch{grid-template-columns:1fr 1fr;}
  .log-item{grid-template-columns:1fr auto}
  .log-item time{grid-column:1/-1}
  .hide-m{display:none}
  .toolbar input[type=search]{max-width:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i aria-hidden="true"></i>Лабжурнал</div>
    <nav class="tabs" aria-label="Разделы">
      <a href="#journal" data-tab="journal">Эксперименты</a>
      <a href="#reagents" data-tab="reagents">Реагенты и стоки</a>
    </nav>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Лаборатория">
      <button type="button" data-site="all" aria-pressed="true">Обе</button>
      <button type="button" data-site="babtai" aria-pressed="false">Бабтай</button>
      <button type="button" data-site="kaunas" aria-pressed="false">Каунас</button>
    </div>
    <span class="sync" id="sync" data-s="">Подключаюсь…</span>
  </div>
</header>

<main id="main">
  <div class="empty">Загружаю журнал…</div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head"><span class="t" id="drTitle"></span><span id="drActions" class="row-actions"></span><button class="btn ghost" type="button" data-act="close" aria-label="Закрыть">✕</button></div>
  <div class="dr-body" id="drBody"></div>
</aside>
<div class="modal" id="modal"><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="openFile" accept=".json,application/json" hidden>

<script>
"use strict";
/* ============================== constants ============================== */
const SITES = { babtai: "Бабтай", kaunas: "Каунас" };
const KINDS = { reagent: "Реагент", stock: "Сток", buffer: "Буфер", mix: "Смесь на месте" };
const STATUS = { planned: "Запланирован", active: "В работе", done: "Завершён" };
const UNITS = { "L":["v",1000], "mL":["v",1], "µL":["v",0.001], "kg":["m",1000], "g":["m",1], "mg":["m",0.001], "µg":["m",1e-6], "шт":["n",1], "аликв.":["a",1] };
const UNIT_LIST = Object.keys(UNITS);
const TYPES = {
  crosslinking: { name: "Кросслинкинг", site: "babtai", stages: [
    { t: "Сбор образцов в PBS + формальдегид", use: ["r_pbs", "r_fa37"] },
    { t: "Вакуум-инфильтрация 3 × 10 мин" },
    { t: "Квенчинг глицином", use: ["r_gly2m"] },
    { t: "Отмывка PBS ×3 + вода ×1", use: ["r_pbs"] },
    { t: "Сушка и заморозка, −80 °C" } ] },
  fractionation: { name: "Фракционирование + TCA", site: "kaunas", stages: [
    { t: "Фракционирование EXB1 → EXB2 → EXB3", use: ["r_exb1", "r_exb2", "r_exb3"] },
    { t: "TCA/ацетон преципитация + отмывка", site: "babtai", next: 1, use: ["r_tca20", "r_acet80"] } ] },
  tca: { name: "TCA-преципитация", site: "babtai", stages: [
    { t: "TCA/ацетон преципитация", use: ["r_tca20"] }, { t: "Отмывка ацетоном ×2", use: ["r_acet80"] }, { t: "Растворение осадка" } ] },
  phenol: { name: "Фенольная экстракция", site: "babtai", stages: [
    { t: "Экстракция фенолом" }, { t: "Преципитация" }, { t: "Отмывка и растворение осадка" } ] },
  transplant: { name: "Пересадка растений", site: "babtai", stages: [ { t: "Пересадка" } ] },
  western: { name: "Western blot", site: "kaunas", stages: [
    { t: "Гели и SDS-PAGE" }, { t: "Перенос и блокировка" }, { t: "Первичные АТ" }, { t: "Вторичные АТ и детекция", next: 1 } ] },
  tryptofluo: { name: "Триптофановая флуоресценция", site: "kaunas", stages: [
    { t: "Буферы и стандарты BSA" }, { t: "Измерение" } ] },
  analysis: { name: "Анализ данных", site: "", stages: [ { t: "Анализ" } ] },
  other: { name: "Другое", site: "kaunas", stages: [ { t: "Этап 1" } ] },
};

/* ============================== helpers ============================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const num = (v) => { if (v === "" || v == null) return null; const n = Number(String(v).replace(",", ".").replace(/\s/g, "")); return isFinite(n) ? n : null; };
const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONTHS_FULL = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function fmtDate(d, withYear) { if (!d) return "—"; const [y, m, dd] = d.split("-"); return `${+dd} ${MONTHS[+m - 1]}${withYear ? " " + y : ""}`; }

  const a = Math.abs(x); const d = a === 0 ? 0 : a < 1 ? 4 : a < 10 ? 3 : a < 100 ? 2 : 1;
  return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: d }).format(+x.toFixed(d));
}

}
function getPath(o, p) { return p.split(".").reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) { const ks = p.split("."); let a = o; for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; }

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

/* ============================== store ============================== */
const S = { exp: {}, rea: {}, mode: "loading", ready: false, readOnly: false };
const COLL = { experiments: "exp", reagents: "rea" };
let DB = null, downloads = null;
const timers = new Map(), inflight = new Set(), again = new Set(), dirty = new Set();
const LOCAL_KEY = "labjournal.local.v1";

function setSync(s, text) { const el = $("#sync"); el.dataset.s = s; el.textContent = text; }
function mapOf(coll) { return S[COLL[coll]]; }

function save(coll, id, delay = 600) {
  const o = mapOf(coll)[id]; if (o) o.updatedAt = Date.now();
  const key = coll + "/" + id; dirty.add(key);
  clearTimeout(timers.get(key));
  timers.set(key, setTimeout(() => { timers.delete(key); flush(coll, id); }, delay));
  if (S.mode === "db") setSync("saving", "Сохраняю…");
}
async function flush(coll, id) {
  const key = coll + "/" + id;
  if (S.mode === "local") { persistLocal(); dirty.delete(key); return; }
  if (S.mode !== "db" || S.readOnly) { dirty.delete(key); return; }
  if (inflight.has(key)) { again.add(key); return; }
  const o = mapOf(coll)[id]; inflight.add(key);
  try {
    if (o) await DB.collection(coll).doc(id).set(clone(o));
    else await DB.collection(coll).doc(id).delete();
    if (!timers.size && inflight.size === 1) setSync("ok", "Синхронизировано");
  } catch (e) {
    if (e && e.code === "invalid_argument") { S.readOnly = true; setSync("err", "Только чтение"); render(); }
    else if (e && e.code === "quota_exceeded") { setSync("err", "Хранилище заполнено"); toast("Хранилище заполнено: удалите лишние записи."); }
    else if (e && e.code === "unavailable") { setTimeout(() => save(coll, id, 0), 1500 + Math.random() * 1500); }
    else { setSync("err", "Ошибка сохранения"); console.warn(e); }
  } finally {
    inflight.delete(key);

}
function remove(coll, id) { delete mapOf(coll)[id]; save(coll, id, 0); }
function payload() { return { app: "labjournal", version: 1, savedAt: S.savedAt || Date.now(), experiments: S.exp, reagents: S.rea }; }
function persistLocal() { S.savedAt = Date.now(); lsSet(LOCAL_KEY, payload()); fileSchedule(); }

/* ---------- journal file on disk (outside claude.ai, Chrome/Edge): the file is the user's own copy ---------- */
let FSA = false; try { FSA = "showOpenFilePicker" in window && window.self === window.top; } catch {}
const FL = { handle: null, name: "", need: false, writing: false, again: false, timer: null, savedAt: 0, error: "" };
let idb = null;
function idbOpen() { return new Promise(res => { try { const r = indexedDB.open("labjournal", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = r.onblocked = () => res(null); } catch { res(null); } }); }

const idbGet = (k) => idbDo("readonly", st => st.get(k));
const idbPut = (k, v) => idbDo("readwrite", st => st.put(v, k));
const idbDel = (k) => idbDo("readwrite", st => st.delete(k));

function fileStatus() {
  if (S.mode !== "local") return;
  if (FL.handle && !FL.need) setSync(FL.error ? "err" : FL.writing || FL.timer ? "saving" : "ok", FL.error ? "Файл не сохранён" : FL.writing || FL.timer ? "Сохраняю в файл…" : "Сохранено в " + FL.name);

}
function fileSchedule() { if (!FL.handle || FL.need) return; clearTimeout(FL.timer); FL.timer = setTimeout(() => { FL.timer = null; fileWrite(); }, 800); fileStatus(); }
async function fileWrite() {
  if (!FL.handle || FL.need) return;
  if (FL.writing) { FL.again = true; return; }
  FL.writing = true; fileStatus();
  try {
    const w = await FL.handle.createWritable();
    await w.write(JSON.stringify(payload(), null, 1)); await w.close();
    FL.savedAt = Date.now(); FL.error = "";
  } catch (e) {
    FL.error = (e && e.message) || "ошибка";
    if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) { FL.need = true; render(); }
  } finally {
    FL.writing = false;
    if (FL.again) { FL.again = false; fileWrite(); } else fileStatus();
  }
}
function applyData(d) {
  S.exp = d.experiments || {}; S.rea = d.reagents || {}; S.savedAt = d.savedAt || Date.now();
  lsSet(LOCAL_KEY, payload()); render(); if (Drawer.coll) Drawer.render();
}
function parseJournal(txt) {
  const d = JSON.parse(txt);
  if (!d || typeof d !== "object" || (!d.experiments && !d.reagents)) throw new Error("not a journal");
  return d;
}
// Use a linked file: the newer of the file and this browser's copy wins.
async function fileAttach(handle, fresh) {
  FL.handle = handle; FL.name = handle.name; FL.need = false; FL.error = "";
  await idbPut("file", handle);
  if (fresh) { await fileWrite(); render(); toast("Журнал сохраняется в " + handle.name); return; }
  let d = null;
  try { const t = await (await handle.getFile()).text(); d = t.trim() ? parseJournal(t) : null; }
  catch { FL.handle = null; FL.name = ""; await idbDel("file"); toast("Это не файл журнала"); render(); return; }
  if (!d) { await fileWrite(); }
  else if ((d.savedAt || 0) >= (S.savedAt || 0) || !Object.keys(S.exp).length) applyData(d);
  else { await fileWrite(); toast("В браузере были более новые записи: сохранила их в файл"); }
  render(); fileStatus();
}
async function fileOpen(confirmed) {
  if (!confirmed && !FL.handle && Object.keys(S.exp).length) {
    confirmBox("Открыть файл журнала?", "Записи, которые сейчас в этом браузере, заменятся содержимым файла. Если они нужны, сначала нажмите «Экспорт».", "Выбрать файл", () => fileOpen(true));
    return;
  }
  if (!FSA) { $("#openFile").click(); return; }
  let h; try { [h] = await window.showOpenFilePicker({ id: "labjournal", types: [{ description: "Журнал (JSON)", accept: { "application/json": [".json"] } }] }); } catch { return; }
  try { if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") { toast("Без разрешения на запись файл не будет обновляться"); return; } } catch {}
  S.savedAt = 0; await fileAttach(h, false);
}
async function fileNew() {
  let h; try { h = await window.showSaveFilePicker({ id: "labjournal", suggestedName: "lab-journal.json", types: [{ description: "Журнал (JSON)", accept: { "application/json": [".json"] } }] }); } catch { return; }
  await fileAttach(h, true);
}
async function fileReconnect() {
  try { if ((await FL.handle.requestPermission({ mode: "readwrite" })) !== "granted") return; } catch { return; }
  await fileAttach(FL.handle, false);
}
async function fileUnlink() { FL.handle = null; FL.name = ""; FL.need = false; await idbDel("file"); render(); fileStatus(); }
function saveDownload(name, text) {
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true; } catch { return false; }
}
function fileBanner() {
  if (S.mode !== "local") return "";
  if (FL.handle && !FL.need) return `<div class="filebar"><span>Журнал сохраняется в файл <b>${esc(FL.name)}</b> на этом компьютере.</span><span class="row-actions"><button class="btn sm ghost" type="button" data-act="file-open">Открыть другой</button><button class="btn sm ghost" type="button" data-act="file-unlink">Отвязать</button></span></div>`;
  if (FL.handle && FL.need) return `<div class="filebar warn"><span>Браузер просит заново разрешить запись в <b>${esc(FL.name)}</b>.</span><span class="row-actions"><button class="btn sm primary" type="button" data-act="file-reconnect">Продолжить с ${esc(FL.name)}</button><button class="btn sm ghost" type="button" data-act="file-open">Другой файл</button></span></div>`;
  if (FSA) return `<div class="filebar warn"><span>Сейчас записи только в этом браузере. Откройте свой файл журнала, и каждое изменение будет сохраняться в него.</span><span class="row-actions"><button class="btn sm primary" type="button" data-act="file-open">Открыть файл .json</button><button class="btn sm" type="button" data-act="file-new">Создать новый файл</button></span></div>`;
  return `<div class="filebar warn"><span>В этом браузере файл нельзя обновлять напрямую: откройте файл журнала, а после работы сохраните его копию.</span><span class="row-actions"><button class="btn sm primary" type="button" data-act="file-open">Открыть файл .json</button><button class="btn sm" type="button" data-act="file-save">Сохранить файл</button></span></div>`;
}

async function startLocal() {
  S.mode = "local"; const d = lsGet(LOCAL_KEY, { experiments: {}, reagents: {} });
  S.exp = d.experiments || {}; S.rea = d.reagents || {}; S.savedAt = d.savedAt || 0; S.ready = true;
  fileStatus(); render();
  if (!FSA) return;
  idb = await idbOpen(); const h = await idbGet("file"); if (!h) return;
  FL.handle = h; FL.name = h.name;
  let perm = "prompt"; try { perm = await h.queryPermission({ mode: "readwrite" }); } catch {}
  if (perm === "granted") await fileAttach(h, false); else { FL.need = true; render(); fileStatus(); }
}
async function init() {
  render();
  let framed = true; try { framed = window.self !== window.top; } catch {}
  for (let k = 0; k < 30 && framed && !(window.claude && window.claude.use); k++) await new Promise(r => setTimeout(r, 100));
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch { downloads = null; }
  if (!db) { startLocal(); return; }
  DB = db; S.mode = "db"; const got = { experiments: false, reagents: false };
  const timeout = setTimeout(() => { if (!S.ready) { setSync("err", "Нет связи"); S.ready = true; S.slow = true; render(); } }, 10000);
  for (const coll of ["experiments", "reagents"]) {
    DB.collection(coll).onSnapshot((snap) => {
      const m = mapOf(coll); let openTouched = false;
      for (const ch of snap.docChanges()) {
        const id = ch.doc.id, key = coll + "/" + id;
        if (dirty.has(key)) continue;
        if (ch.type === "removed") delete m[id]; else m[id] = clone(ch.doc.data());
        if (Drawer.coll === coll && Drawer.id === id) openTouched = true;
      }
      if (!snap.metadata.fromCache) { got[coll] = true; }
      if (got.experiments && got.reagents) { clearTimeout(timeout); S.ready = true; S.slow = false; if (!timers.size && !inflight.size) setSync("ok", "Синхронизировано"); }
      else if (!S.ready && snap.size) S.ready = true;
      render(); if (openTouched) Drawer.remoteChanged();
    }, (e) => { clearTimeout(timeout); setSync("err", e && e.code === "revoked" ? "Доступ закрыт" : "Нет связи"); S.ready = true; render(); });
  }
}

/* ============================== domain ============================== */
function expSites(e) { const s = new Set((e.stages || []).map(x => x.site).filter(Boolean)); return [...s]; }
function siteClass(sites) { return sites.length > 1 ? "s-both" : sites.length ? "s-" + sites[0] : ""; }
function matchSite(sites) { return UI.site === "all" || sites.includes(UI.site); }
function usageDate(e, s) { return s.date || e.startDate || ""; }

function ledger(rid) {
  const r = S.rea[rid]; if (!r) return { events: [], balance: null, used: 0 };
  const ev = [];
  for (const b of r.batches || []) ev.push({ date: b.date || "", ts: b.ts || 0, kind: b.kind || "add", amount: b.amount, unit: b.unit || r.unit, note: b.note || "", ref: { t: "batch", id: b.id } });
  for (const [eid, e] of Object.entries(S.exp)) for (const s of e.stages || []) (s.usages || []).forEach((u, i) => {
    if (u.reagentId === rid) ev.push({ date: usageDate(e, s), ts: u.ts || 0, kind: "use", amount: u.amount, unit: u.unit || r.unit, note: u.note || "", ref: { t: "exp", id: eid, stage: s.id, idx: i, title: e.title, stageTitle: s.title } });
  });
  for (const [oid, o] of Object.entries(S.rea)) for (const b of o.batches || []) (b.consumed || []).forEach((c) => {
    if (c.reagentId === rid) ev.push({ date: b.date || "", ts: c.ts || b.ts || 0, kind: "use", amount: c.amount, unit: c.unit || r.unit, note: "", ref: { t: "rea", id: oid, title: o.name } });
  });
  ev.sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.ts - b.ts));
  let bal = null, used = 0;
  for (const x of ev) {
    const n = num(x.amount); const q = n == null ? 0 : conv(n, x.unit, r.unit); x.q = q;
    if (q == null) { x.bad = true; }
    else if (x.kind === "add") bal = (bal ?? 0) + q;
    else if (x.kind === "count") bal = q;
    else { used += q; if (bal != null) bal -= q; }
    x.bal = bal;
  }
  return { events: ev, balance: bal, used };
}
function isLow(r, bal) { return r.kind !== "mix" && bal != null && ((r.low != null && bal <= r.low) || bal <= 0); }
function lastUse(L) { for (let i = L.events.length - 1; i >= 0; i--) if (L.events[i].kind === "use") return L.events[i]; return null; }

/* ============================== UI state & render ============================== */
const UI = { tab: "journal", site: lsGet("labjournal.site", "all"), q: "", type: "", status: "", kind: "", lowOnly: false };

function render() {
  const h = (location.hash || "#journal").slice(1); UI.tab = h === "reagents" ? "reagents" : "journal";
  $$("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === UI.tab ? "page" : "false"));
  $$(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.site === UI.site)));
  const main = $("#main");
  const keepFocus = document.activeElement && main.contains(document.activeElement) ? document.activeElement.id : null;
  const sel = keepFocus ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  if (!S.ready) { main.innerHTML = `<div class="empty">Загружаю журнал…</div>`; return; }
  main.innerHTML = (S.readOnly ? `<div class="banner">Здесь можно только смотреть: изменения не сохраняются для вашего уровня доступа.</div>` : "")
    + fileBanner()
    + (S.slow ? `<div class="banner">Хранилище пока не отвечает. Показанные данные могут быть неполными.</div>` : "")
    + (UI.tab === "journal" ? viewJournal() : viewReagents());
  if (keepFocus) { const el = document.getElementById(keepFocus); if (el) { el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
}
let renderT; function renderSoon() { clearTimeout(renderT); renderT = setTimeout(render, 150); }

function viewJournal() {
  const q = UI.q.trim().toLowerCase();
  const list = Object.entries(S.exp).map(([id, e]) => ({ id, e, sites: expSites(e) }))
    .filter(x => matchSite(x.sites) || (!x.sites.length && UI.site === "all"))
    .filter(x => !UI.type || x.e.type === UI.type)
    .filter(x => !UI.status || x.e.status === UI.status)
    .filter(x => !q || JSON.stringify([x.e.title, x.e.samples, x.e.notes, x.e.sourceFile, (x.e.stages || []).map(s => [s.title, s.notes]), (x.e.log || []).map(l => l.text)]).toLowerCase().includes(q))
    .sort((a, b) => (b.e.startDate || "").localeCompare(a.e.startDate || "") || (b.e.createdAt || 0) - (a.e.createdAt || 0));
  const active = list.filter(x => x.e.status !== "done");
  const month = today().slice(0, 7);
  const allLow = Object.entries(S.rea).filter(([id, r]) => (UI.site === "all" || r.site === UI.site) && isLow(r, ledger(id).balance)).length;
  const thisMonth = list.filter(x => (x.e.startDate || "").slice(0, 7) === month).length;
  const stageDays = new Set(); list.forEach(x => (x.e.stages || []).forEach(s => s.date && (UI.site === "all" || s.site === UI.site) && stageDays.add(s.date)));
  let html = `<div class="toolbar">
    <button class="btn primary" type="button" data-act="new-exp" ${S.readOnly ? "disabled" : ""}>+ Эксперимент</button>
    <input type="search" id="q" placeholder="Поиск по названию, образцам, заметкам" value="${esc(UI.q)}" aria-label="Поиск">
    <select id="fType" aria-label="Тип"><option value="">Все типы</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${UI.type === k ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
    <select id="fStatus" aria-label="Статус"><option value="">Любой статус</option>${Object.entries(STATUS).map(([k, t]) => `<option value="${k}" ${UI.status === k ? "selected" : ""}>${t}</option>`).join("")}</select>
    <span class="spacer"></span>
    <button class="btn ghost sm" type="button" data-act="export">Экспорт</button>
    <button class="btn ghost sm" type="button" data-act="import" ${S.readOnly ? "disabled" : ""}>Импорт</button>
  </div>
  <div class="stats">
    <div class="stat"><b>${list.length}</b><span>экспериментов${UI.site !== "all" ? " · " + SITES[UI.site] : ""}</span></div>
    <div class="stat"><b>${active.length}</b><span>в работе или в плане</span></div>
    <div class="stat"><b>${stageDays.size}</b><span>рабочих дней в журнале</span></div>
    <div class="stat ${allLow ? "warn" : ""}"><b>${allLow}</b><span><a class="lnk" href="#reagents" data-act="low-reagents">реагентов на исходе</a></span></div>
  </div>`;
  if (!Object.keys(S.exp).length) {
    return html + `<div class="empty">Пока нет ни одного эксперимента. ${S.mode === "local" ? "Откройте свой файл журнала (lab-journal.json) или нажмите «+ Эксперимент»." : "Нажмите «+ Эксперимент» или загрузите резервную копию через «Импорт»."}</div>`;
  }
  if (!list.length) return html + `<div class="empty">Ничего не нашлось с такими фильтрами.</div>`;
  if (active.length && !UI.status) html += `<section class="block"><div class="block-h">Сейчас в работе <span class="n">${active.length}</span></div><div class="cards">${active.map(cardExp).join("")}</div></section>`;
  const rest = UI.status ? list : list.filter(x => x.e.status === "done");
  const groups = {};
  rest.forEach(x => { const k = (x.e.startDate || "").slice(0, 7) || "—"; (groups[k] = groups[k] || []).push(x); });
  for (const k of Object.keys(groups).sort().reverse()) {
    const label = k === "—" ? "Без даты" : `${MONTHS_FULL[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
    html += `<section class="block"><div class="block-h">${label} <span class="n">${groups[k].length}</span></div><div class="cards">${groups[k].map(cardExp).join("")}</div></section>`;
  }
  return html;
}
function cardExp({ id, e, sites }) {
  const st = e.stages || []; const done = st.filter(s => s.done).length;
  const uses = st.reduce((a, s) => a + (s.usages || []).filter(u => u.reagentId).length, 0);
  const d1 = e.startDate, d2 = e.endDate && e.endDate !== e.startDate ? e.endDate : "";
  const t = TYPES[e.type];
  return `<button type="button" class="card ${siteClass(sites)}" data-open-exp="${esc(id)}">
    <div class="d"><b>${fmtDate(d1)}</b>${d2 ? "→ " + fmtDate(d2) : esc((d1 || "").slice(0, 4))}</div>
    <div><h3>${esc(e.title || "Без названия")}</h3>
      <div class="meta"><span class="tag st-${esc(e.status)}">${STATUS[e.status] || ""}</span>${t ? `<span class="tag">${esc(t.name)}</span>` : ""}${sites.map(s => `<span class="tag ${s}">${SITES[s]}</span>`).join("")}${uses ? `<span class="tag">реагентов: ${uses}</span>` : ""}</div>
      ${e.samples ? `<div class="sub">${esc(e.samples)}</div>` : ""}</div>
    <div class="prog"><div class="bar"><i style="width:${st.length ? Math.round(done / st.length * 100) : 0}%"></i></div><small>${done}/${st.length} этапов</small></div>
  </button>`;
}

function viewReagents() {
  const q = UI.q.trim().toLowerCase();
  const rows = Object.entries(S.rea).map(([id, r]) => ({ id, r, L: ledger(id) }))

    const what = x.ref.t === "exp" ? `<a class="lnk" data-open-exp="${esc(x.ref.id)}">${esc(x.ref.title)}</a><span class="small">${esc(x.ref.stageTitle || "")}${x.note ? " · " + esc(x.note) : ""}</span>`
      : x.ref.t === "rea" ? `на партию <a class="lnk" data-open-rea="${esc(x.ref.id)}">${esc(x.ref.title)}</a>`
      : (x.kind === "count" ? "Инвентаризация" : "Пополнение") + (x.note ? `<span class="small">${esc(x.note)}</span>` : "");
    const ch = x.bad ? `<span class="small" style="color:var(--bad)">${fmtNum(num(x.amount))} ${esc(x.unit)}: не переводится</span>` : x.kind === "count" ? `= ${fmtNum(x.q)}` : (x.kind === "add" ? "+" : "−") + fmtNum(x.q);
    return `<tr class="${x.kind}"><td class="num">${x.date ? fmtDate(x.date, true) : "без даты"}</td><td>${what}</td><td class="r num">${ch}</td>${r.kind !== "mix" ? `<td class="r num">${x.bal == null ? "—" : fmtNum(x.bal)}</td>` : ""}</tr>`;
  }).join("")}</tbody></table>`;
}

/* ============================== modals ============================== */
const Modal = {
  onOk: null,
  open(html, onOk) { $("#modalBox").innerHTML = html; $("#modal").classList.add("open"); this.onOk = onOk; const f = $("#modalBox input,#modalBox select"); if (f) f.focus(); },
  close() { $("#modal").classList.remove("open"); this.onOk = null; },
};
function confirmBox(title, text, okLabel, fn) {
  Modal.open(`<h2>${esc(title)}</h2><p>${text}</p><div class="modal-foot"><button class="btn" type="button" data-m="cancel">Отмена</button><button class="btn primary" type="button" data-m="ok">${esc(okLabel)}</button></div>`, () => { fn(); return true; });
}

function newExperiment() {
  const tOpts = Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${esc(t.name)}</option>`).join("");
  Modal.open(`<h2>Новый эксперимент</h2>
    <label class="f"><span>Тип</span><select id="mType">${tOpts}</select></label>
    <label class="f"><span>Название</span><input type="text" id="mTitle" placeholder="оставьте пустым — будет «Тип + дата»"></label>
    <div class="grid2"><label class="f"><span>Дата начала</span><input type="date" id="mDate" value="${today()}"></label>
    <label class="f"><span>Лаборатория</span><select id="mSite">${siteOptions(UI.site !== "all" ? UI.site : "babtai", true)}</select></label></div>
    <label class="check"><input type="checkbox" id="mPreset" checked> Сразу добавить типовые этапы</label>
    <div class="modal-foot"><button class="btn" type="button" data-m="cancel">Отмена</button><button class="btn primary" type="button" data-m="ok">Создать</button></div>`, () => {
    const type = $("#mType").value, t = TYPES[type], date = $("#mDate").value || today(), site = $("#mSite").value;
    const id = uid("e_");
    const stages = $("#mPreset").checked ? t.stages.map((p) => ({ id: uid("s"), title: p.t, date: p.next ? "" : date, site: p.site || site, done: false, notes: "", usages: (p.use || []).filter(r => S.rea[r]).map(r => ({ reagentId: r, amount: "", unit: S.rea[r].unit, note: "", ts: Date.now() })) })) : [];
    S.exp[id] = { title: $("#mTitle").value.trim() || `${t.name} ${fmtDate(date)}`, type, status: date > today() ? "planned" : "active", startDate: date, endDate: "", samples: "", notes: "", stages, sourceFile: "", parentId: "", log: [], createdAt: Date.now(), updatedAt: Date.now() };
    save("experiments", id, 0); render(); Drawer.open("experiments", id); return true;
  });
  $("#mType").addEventListener("change", () => { const s = TYPES[$("#mType").value].site; $("#mSite").value = s; });
  $("#mSite").value = UI.site !== "all" ? UI.site : TYPES.crosslinking.site;
}
function newReagent() {
  const id = uid("r_");
  S.rea[id] = { name: "Новый реагент", kind: "stock", site: UI.site !== "all" ? UI.site : "babtai", unit: "mL", conc: "", location: "", low: null, notes: "", recipe: { baseAmount: null, components: [], notes: "" }, batches: [], createdAt: Date.now(), updatedAt: Date.now() };
  save("reagents", id, 0); render(); Drawer.open("reagents", id);
  setTimeout(() => { const el = $("#r-name"); if (el) { el.focus(); el.select(); } }, 220);
}
function batchModal(kind) {
  const r = Drawer.doc();
  Modal.open(`<h2>${kind === "count" ? "Сколько осталось сейчас" : "Новая партия или пополнение"}</h2>
    <p class="hint">${kind === "count" ? "Остаток будет выставлен на это значение, дальше расход считается от него." : "Количество прибавится к остатку."}</p>
    <div class="grid2"><label class="f"><span>Дата</span><input type="date" id="mDate" value="${today()}"></label>
    <label class="f"><span>Количество, ${esc(r.unit)}</span><input type="text" inputmode="decimal" id="mAmt"></label></div>
    <label class="f"><span>Комментарий</span><input type="text" id="mNote" placeholder="${kind === "count" ? "проверила бутылку" : "номер лота, кто готовил"}"></label>
    <div class="modal-foot"><button class="btn" type="button" data-m="cancel">Отмена</button><button class="btn primary" type="button" data-m="ok">Записать</button></div>`, () => {
    const a = num($("#mAmt").value); if (a == null) { $("#mAmt").focus(); return false; }
    (r.batches = r.batches || []).push({ id: uid("b_"), date: $("#mDate").value || today(), kind, amount: a, unit: r.unit, note: $("#mNote").value.trim(), ts: Date.now() });
    save("reagents", Drawer.id); Drawer.render(); render(); return true;
  });
}
let RP = null;
function recipePreview() {
  if (!RP) return ""; const r = S.rea[RP.rid]; const base = num(r.recipe.baseAmount); const target = num($("#mAmt")?.value);
  if (!base) return `<div class="hint">Сначала впишите, на какой объём рецепт («Рецепт на …»).</div>`;
  if (!target) return `<div class="hint">Введите количество.</div>`;
  const f = target / base;
  return `<table><thead><tr><th>Компонент</th><th class="r">Нужно</th><th>Списать со</th></tr></thead><tbody>${r.recipe.components.map(c => { const n = num(c.amount); return `<tr><td>${esc(c.name)}${c.finalConc ? `<span class="small">${esc(c.finalConc)}</span>` : ""}</td><td class="r num">${n == null ? esc(c.amount) : fmtNum(n * f) + " " + esc(c.unit)}</td><td>${c.reagentId && S.rea[c.reagentId] ? esc(S.rea[c.reagentId].name) : "—"}</td></tr>`; }).join("")}</tbody></table><p class="hint">Коэффициент × ${fmtNum(f)}</p>`;
}
function scaledConsumption(rid, target) {
  const r = S.rea[rid]; const f = target / num(r.recipe.baseAmount);
  return r.recipe.components.filter(c => c.reagentId && S.rea[c.reagentId] && num(c.amount) != null).map(c => ({ reagentId: c.reagentId, amount: +(num(c.amount) * f).toPrecision(6), unit: c.unit || S.rea[c.reagentId].unit, note: "по рецепту: " + r.name, ts: Date.now() }));
}
function makeBatchModal() {
  const r = Drawer.doc(); RP = { rid: Drawer.id };
  Modal.open(`<h2>Приготовить: ${esc(r.name)}</h2>
    <div class="grid2"><label class="f"><span>Дата</span><input type="date" id="mDate" value="${today()}"></label>
    <label class="f"><span>Сколько готовлю, ${esc(r.unit)}</span><input type="text" inputmode="decimal" id="mAmt" value="${esc(r.recipe.baseAmount ?? "")}"></label></div>
    <div class="tbl-wrap" id="recipePrev">${recipePreview()}</div>
    <label class="check"><input type="checkbox" id="mConsume" checked> Списать связанные компоненты со стоков</label>
    <label class="f"><span>Комментарий</span><input type="text" id="mNote"></label>
    <div class="modal-foot"><button class="btn" type="button" data-m="cancel">Отмена</button><button class="btn primary" type="button" data-m="ok">Записать партию</button></div>`, () => {
    const a = num($("#mAmt").value); if (a == null || !num(r.recipe.baseAmount)) return false;
    const b = { id: uid("b_"), date: $("#mDate").value || today(), kind: "add", amount: a, unit: r.unit, note: ($("#mNote").value.trim() || "приготовлено по рецепту"), ts: Date.now() };
    if ($("#mConsume").checked) b.consumed = scaledConsumption(RP.rid, a);
    (r.batches = r.batches || []).push(b); save("reagents", Drawer.id); RP = null; Drawer.render(); render(); return true;
  });
  $("#recipePrev").innerHTML = recipePreview();
  $("#mAmt").addEventListener("input", () => { $("#recipePrev").innerHTML = recipePreview(); });
}
function recipeUsageModal(i) {
  const e = Drawer.doc(); const s = e.stages[i];
  const recipes = Object.entries(S.rea).filter(([, r]) => (r.recipe?.components || []).some(c => c.reagentId) && num(r.recipe.baseAmount));
  if (!recipes.length) { toast("Нет рецептов со связанными стоками. Добавьте их во вкладке «Реагенты»."); return; }
  RP = { rid: recipes[0][0] };
  Modal.open(`<h2>Списать компоненты по рецепту</h2>
    <label class="f"><span>Рецепт</span><select id="mRec">${recipes.map(([id, r]) => `<option value="${esc(id)}">${esc(r.name)} (на ${fmtNum(num(r.recipe.baseAmount))} ${esc(r.unit)})</option>`).join("")}</select></label>
    <label class="f"><span>Сколько приготовлено</span><input type="text" inputmode="decimal" id="mAmt" value="${esc(recipes[0][1].recipe.baseAmount)}"></label>
    <div class="tbl-wrap" id="recipePrev">${""}</div>
    <div class="modal-foot"><button class="btn" type="button" data-m="cancel">Отмена</button><button class="btn primary" type="button" data-m="ok">Добавить в этап</button></div>`, () => {
    const a = num($("#mAmt").value); if (a == null) return false;
    s.usages = (s.usages || []).concat(scaledConsumption(RP.rid, a));
    save("experiments", Drawer.id); RP = null; Drawer.render(); render(); return true;
  });
  $("#recipePrev").innerHTML = recipePreview();
  $("#mRec").addEventListener("change", () => { RP.rid = $("#mRec").value; $("#mAmt").value = S.rea[RP.rid].recipe.baseAmount ?? ""; $("#recipePrev").innerHTML = recipePreview(); });
  $("#mAmt").addEventListener("input", () => { $("#recipePrev").innerHTML = recipePreview(); });
}

/* ============================== export / import ============================== */
async function doExport() {
  const data = JSON.stringify({ app: "labjournal", version: 1, exportedAt: new Date().toISOString(), experiments: S.exp, reagents: S.rea }, null, 1);
  const fn = `lab-journal-${today()}.json`;
  if (downloads) { try { await downloads.save({ filename: fn, data }); return; } catch (e) { if (e && e.code === "declined") return; } }
  if (S.mode === "local" && saveDownload(fn, data)) return;
  try { await navigator.clipboard.writeText(data); toast("Резервная копия скопирована в буфер обмена"); } catch { toast("Не получилось сохранить файл"); }
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d; try { d = JSON.parse(fr.result); } catch { toast("Это не файл журнала (JSON)"); return; }
    const ne = Object.keys(d.experiments || {}).length, nr = Object.keys(d.reagents || {}).length;
    confirmBox("Импорт", `В файле ${ne} экспериментов и ${nr} реагентов. Записи с теми же id будут заменены, остальные сохранятся.`, "Импортировать", async () => {
      for (const [id, o] of Object.entries(d.experiments || {})) { S.exp[id] = o; save("experiments", id, 50); }
      for (const [id, o] of Object.entries(d.reagents || {})) { S.rea[id] = o; save("reagents", id, 50); }
      render(); toast("Импортировано");
    });
  };
  fr.readAsText(file);
}

/* ============================== events ============================== */
document.addEventListener("click", (ev) => {
  const t = ev.target;
  const m = t.closest("[data-m]");
  if (m) { if (m.dataset.m === "cancel") Modal.close(); else if (Modal.onOk && Modal.onOk() !== false) Modal.close(); return; }
  if (t.id === "modal") { Modal.close(); return; }
  const oe = t.closest("[data-open-exp]"); if (oe) { ev.preventDefault(); Drawer.open("experiments", oe.dataset.openExp); return; }
  const or = t.closest("[data-open-rea]"); if (or) { ev.preventDefault(); Drawer.open("reagents", or.dataset.openRea); return; }
  if (t.id === "scrim") { Drawer.close(); return; }
  const sb = t.closest(".seg button"); if (sb) { UI.site = sb.dataset.site; lsSet("labjournal.site", UI.site); render(); return; }
  const a = t.closest("[data-act]"); if (!a || a.disabled) return;
  const act = a.dataset.act; const o = Drawer.doc();
  const i = a.dataset.i != null ? +a.dataset.i : null, j = a.dataset.j != null ? +a.dataset.j : null;
  switch (act) {
    case "close": Drawer.close(); break;
    case "new-exp": newExperiment(); break;
    case "new-rea": newReagent(); break;
    case "export": doExport(); break;
    case "import": $("#importFile").click(); break;
    case "file-open": fileOpen(); break;
    case "file-new": fileNew(); break;
    case "file-reconnect": fileReconnect(); break;
    case "file-unlink": fileUnlink(); break;
    case "file-save": saveDownload("lab-journal.json", JSON.stringify(payload(), null, 1)) || toast("Не получилось сохранить файл"); break;
    case "low-reagents": UI.lowOnly = true; break;
    case "add-stage": { const last = (o.stages || [])[o.stages.length - 1]; (o.stages = o.stages || []).push({ id: uid("s"), title: "", date: today(), site: last ? last.site : (TYPES[o.type]?.site || ""), done: false, notes: "", usages: [] }); save("experiments", Drawer.id); Drawer.render(); setTimeout(() => { const s = o.stages[o.stages.length - 1]; const el = $(`#s-${s.id}-t`); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } }, 30); render(); break; }
    case "preset-stages": { const t = TYPES[o.type]; o.stages = t.stages.map(p => ({ id: uid("s"), title: p.t, date: p.next ? "" : (o.startDate || today()), site: p.site || t.site, done: false, notes: "", usages: (p.use || []).filter(r => S.rea[r]).map(r => ({ reagentId: r, amount: "", unit: S.rea[r].unit, note: "", ts: Date.now() })) })); save("experiments", Drawer.id); Drawer.render(); render(); break; }
    case "del-stage": { const s = o.stages[i]; confirmBox("Удалить этап?", `«${esc(s.title || "без названия")}» и записанный в нём расход реагентов будут удалены.`, "Удалить", () => { o.stages.splice(i, 1); save("experiments", Drawer.id); Drawer.render(); render(); }); break; }
    case "stage-up": if (i > 0) { const s = o.stages.splice(i, 1)[0]; o.stages.splice(i - 1, 0, s); save("experiments", Drawer.id); Drawer.render(); } break;
    case "add-usage": { const s = o.stages[i]; (s.usages = s.usages || []).push({ reagentId: "", amount: "", unit: "mL", note: "", ts: Date.now() }); save("experiments", Drawer.id); Drawer.render(); const el = $(`#u-${s.id}-${s.usages.length - 1}-r`); if (el) el.focus(); break; }
    case "recipe-usage": recipeUsageModal(i); break;
    case "del-usage": o.stages[i].usages.splice(j, 1); save("experiments", Drawer.id); Drawer.render(); render(); break;
    case "add-log": { const tx = $("#logText").value.trim(); if (!tx) break; (o.log = o.log || []).push({ ts: Date.now(), text: tx }); save("experiments", Drawer.id, 0); Drawer.render(); break; }
    case "del-log": o.log = (o.log || []).filter(l => String(l.ts) !== a.dataset.ts); save("experiments", Drawer.id); Drawer.render(); break;
    case "dup-exp": {
      const id = uid("e_"); const c = clone(o); const d = today();
      c.title = c.title.replace(/\s*[\d,\s–-]*\s(янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)\S*$/i, "").trim() + " " + fmtDate(d);
      c.startDate = d; c.endDate = ""; c.status = "active"; c.log = []; c.parentId = ""; c.sourceFile = ""; c.createdAt = c.updatedAt = Date.now();
      c.stages = c.stages.map(s => ({ ...s, id: uid("s"), date: d, done: false, notes: "", usages: (s.usages || []).map(u => ({ ...u, ts: Date.now() })) }));
      S.exp[id] = c; save("experiments", id, 0); render(); Drawer.open("experiments", id); toast("Копия создана с сегодняшней датой: поправьте количества"); break;
    }
    case "del-exp": confirmBox("Удалить эксперимент?", `«${esc(o.title)}» и весь его расход реагентов будут удалены. Это нельзя отменить.`, "Удалить", () => { const id = Drawer.id; remove("experiments", id); Drawer.close(); }); break;
    case "del-rea": {
      const used = ledger(Drawer.id).events.filter(x => x.kind === "use").length;
      confirmBox("Удалить реагент?", `«${esc(o.name)}» исчезнет из списка.${used ? ` В экспериментах есть ${used} записей расхода, они останутся с пометкой «удалён».` : ""}`, "Удалить", () => { const id = Drawer.id; remove("reagents", id); Drawer.close(); }); break;
    }
    case "add-batch": batchModal("add"); break;
    case "add-count": batchModal("count"); break;
    case "make-batch": makeBatchModal(); break;
    case "del-batch": confirmBox("Удалить запись партии?", "Остаток будет пересчитан.", "Удалить", () => { o.batches.splice(j, 1); save("reagents", Drawer.id); Drawer.render(); render(); }); break;
    case "add-comp": { const rc = o.recipe = o.recipe || { baseAmount: null, components: [], notes: "" }; (rc.components = rc.components || []).push({ name: "", amount: "", unit: "mL", reagentId: "", stockConc: "", finalConc: "" }); save("reagents", Drawer.id); Drawer.render(); const el = $(`#c-${rc.components.length - 1}-n`); if (el) el.focus(); break; }
    case "del-comp": o.recipe.components.splice(j, 1); save("reagents", Drawer.id); Drawer.render(); break;
  }
  if (act === "low-reagents") { /* falls through to hash change */ }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { if ($("#modal").classList.contains("open")) Modal.close(); else if (Drawer.coll) Drawer.close(); }
  if (ev.key === "Enter" && ev.target.id === "logText") { ev.preventDefault(); $('[data-act="add-log"]').click(); }
  if (ev.key === "Enter" && $("#modal").classList.contains("open") && ev.target.tagName === "INPUT") { ev.preventDefault(); const ok = $('#modalBox [data-m="ok"]'); if (ok) ok.click(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("tr[data-open-rea]")) { ev.preventDefault(); Drawer.open("reagents", ev.target.dataset.openRea); }
});
function onField(ev, final) {
  const el = ev.target; if (!el.dataset || !el.dataset.f || !$("#drBody").contains(el)) return;
  const o = Drawer.doc(); if (!o) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num && typeof v === "string") { const n = num(v); v = n == null ? (v.trim() === "" ? "" : v) : n; if (el.dataset.f === "low" && v === "") v = null; }
  const path = el.dataset.f;
  if (getPath(o, path) === v) return;
  setPath(o, path, v);
  // side effects
  const mu = path.match(/^stages\.(\d+)\.usages\.(\d+)\.reagentId$/);
  if (mu && S.rea[v]) { const u = o.stages[+mu[1]].usages[+mu[2]]; if (conv(1, u.unit, S.rea[v].unit) == null || !u.amount) u.unit = S.rea[v].unit; }
  if (/^stages\.\d+\.done$/.test(path) && Drawer.coll === "experiments") { const st = o.stages; if (st.length && st.every(s => s.done) && o.status !== "done") { o.status = "done"; const d = st.map(s => s.date).filter(Boolean).sort().pop(); if (d && !o.endDate) o.endDate = d; } else if (!st.every(s => s.done) && o.status === "planned") o.status = "active"; }
  save(Drawer.coll, Drawer.id, final ? 300 : 700);
  if (el.dataset.rerender || el.type === "checkbox" || /\.done$/.test(path) || path === "status" || path === "kind") { setTimeout(() => Drawer.render(), 0); }
  else Drawer.live();
  renderSoon();
}
document.addEventListener("input", (ev) => {
  if (ev.target.id === "q") { UI.q = ev.target.value; renderSoon(); return; }
  if (ev.target.tagName === "SELECT" || ev.target.type === "checkbox" || ev.target.type === "date") return;
  onField(ev, false);
});
document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "fType") { UI.type = ev.target.value; render(); return; }
  if (id === "fStatus") { UI.status = ev.target.value; render(); return; }
  if (id === "fKind") { UI.kind = ev.target.value; render(); return; }
  if (id === "fLow") { UI.lowOnly = ev.target.checked; render(); return; }
  if (id === "openFile") { const f = ev.target.files[0]; ev.target.value = ""; if (!f) return; f.text().then(t => { try { applyData(parseJournal(t)); toast("Открыт " + f.name); } catch { toast("Это не файл журнала"); } }); return; }
  if (id === "importFile") { if (ev.target.files[0]) doImport(ev.target.files[0]); ev.target.value = ""; return; }
  onField(ev, true);
});
document.addEventListener("focusout", () => { setTimeout(() => { if (Drawer.stale && !$("#drBody").contains(document.activeElement)) Drawer.render(); }, 50); });
window.addEventListener("hashchange", () => { UI.q = ""; render(); });

init();
</script>
